<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Comerciales</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-3">
	<div class="container">
		<a class="navbar-brand" th:href="@{/clientes}">Ventas</a>
		<ul class="navbar-nav">
			<li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
			<li class="nav-item"><a class="nav-link active" th:href="@{/comerciales}">Comerciales</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/pedidos}">Pedidos</a></li>
		</ul>
	</div>
</nav>
<div class="container">
	<div th:if="${mensaje}" class="alert alert-success" role="alert" th:text="${mensaje}">Mensaje</div>
	<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>

	<div class="row align-items-center border-bottom py-3">
		<div class="col-6">
			<h1 class="display-6 mb-0">Comerciales</h1>
		</div>
		<div class="col-6 text-end">
			<a class="btn btn-primary" th:href="@{/comerciales/crear}">Crear</a>
		</div>
	</div>

	<div class="row fw-bold border-bottom py-2">
		<div class="col-1">Id</div>
		<div class="col-2">Nombre</div>
		<div class="col-2">Apellido 1</div>
		<div class="col-2">Apellido 2</div>
		<div class="col-2">Comisión</div>
		<div class="col-3 text-center">Acción</div>
	</div>

	<div class="row py-2 border-bottom align-items-center" th:each="comercial : ${listaComerciales}">
		<div class="col-1" th:text="${comercial.id}">Id</div>
		<div class="col-2" th:text="${comercial.nombre}">Nombre</div>
		<div class="col-2" th:text="${comercial.apellido1}">Apellido 1</div>
		<div class="col-2" th:text="${comercial.apellido2}">Apellido 2</div>
		<div class="col-2" th:text="${comercial.comision}">Comisión</div>
		<div class="col-3 d-flex justify-content-center flex-wrap gap-1">
			<a class="btn btn-success btn-sm" th:href="@{/comerciales/__${comercial.id}__}">Ver Detalle</a>
			<a class="btn btn-primary btn-sm" th:href="@{/comerciales/editar/__${comercial.id}__}">Editar</a>
			<form th:action="@{/comerciales/borrar/__${comercial.id}__}" method="post" class="d-inline"
				onsubmit="return confirm('¿Seguro que quieres eliminar este comercial?');">
				<button class="btn btn-danger btn-sm" type="submit">Eliminar</button>
			</form>
		</div>
	</div>
</div>
</body>
</html>
