<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Detalle Cliente</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-3">
	<div class="container">
		<a class="navbar-brand" th:href="@{/clientes}">Ventas</a>
		<ul class="navbar-nav">
			<li class="nav-item"><a class="nav-link active" th:href="@{/clientes}">Clientes</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/comerciales}">Comerciales</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/pedidos}">Pedidos</a></li>
		</ul>
	</div>
</nav>
<div class="container">
	<div class="row align-items-center border-bottom py-3 mb-3">
		<div class="col-6">
			<h1 class="display-6 mb-0">Detalle Cliente</h1>
		</div>
		<div class="col-6 text-end">
			<a class="btn btn-secondary" th:href="@{/clientes}">Volver</a>
		</div>
	</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Id</label>
			<div class="col-md-6">
				<input type="text" class="form-control" th:value="${cliente.id}" readonly="readonly"/>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Nombre</label>
			<div class="col-md-6">
				<input type="text" class="form-control" th:value="${cliente.nombre}" readonly="readonly"/>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Apellido 1</label>
			<div class="col-md-6">
				<input type="text" class="form-control" th:value="${cliente.apellido1}" readonly="readonly"/>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Apellido 2</label>
			<div class="col-md-6">
				<input type="text" class="form-control" th:value="${cliente.apellido2}" readonly="readonly"/>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Ciudad</label>
			<div class="col-md-6">
				<input type="text" class="form-control" th:value="${cliente.ciudad}" readonly="readonly"/>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Categoría</label>
			<div class="col-md-6">
				<input type="number" class="form-control" th:value="${cliente.categoria}" readonly="readonly"/>
			</div>
		</div>
</div>
</body>
</html>
