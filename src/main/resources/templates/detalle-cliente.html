<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Detalle Cliente</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-3">
	<div class="container">
		<a class="navbar-brand" th:href="@{/clientes}">Ventas</a>
		<ul class="navbar-nav">
			<li class="nav-item"><a class="nav-link active" th:href="@{/clientes}">Clientes</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/comerciales}">Comerciales</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/pedidos}">Pedidos</a></li>
		</ul>
	</div>
</nav>
<div class="container">
	<div class="row align-items-center border-bottom py-3 mb-3">
		<div class="col-6">
			<h1 class="display-6 mb-0">Detalle Cliente</h1>
		</div>
		<div class="col-6 text-end">
			<a class="btn btn-secondary" th:href="@{/clientes}">Volver</a>
		</div>
	</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Id</label>
			<div class="col-md-6">
				<input type="text" class="form-control" th:value="${cliente.id}" readonly="readonly"/>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Nombre</label>
			<div class="col-md-6">
				<input type="text" class="form-control" th:value="${cliente.nombre}" readonly="readonly"/>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Apellido 1</label>
			<div class="col-md-6">
				<input type="text" class="form-control" th:value="${cliente.apellido1}" readonly="readonly"/>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Apellido 2</label>
			<div class="col-md-6">
				<input type="text" class="form-control" th:value="${cliente.apellido2}" readonly="readonly"/>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Ciudad</label>
			<div class="col-md-6">
				<input type="text" class="form-control" th:value="${cliente.ciudad}" readonly="readonly"/>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Categoría</label>
			<div class="col-md-6">
				<input type="number" class="form-control" th:value="${cliente.categoria}" readonly="readonly"/>
			</div>
		</div>
	<h2 class="h4 mt-4 pb-2 border-bottom">Pedidos</h2>

	<div th:if="${#lists.isEmpty(listaPedidos)}" class="alert alert-info">
		Este cliente no tiene pedidos.
	</div>

	<div th:unless="${#lists.isEmpty(listaPedidos)}">
		<div class="row fw-bold border-bottom py-2">
			<div class="col-2">Id</div>
			<div class="col-3">Fecha</div>
			<div class="col-4">Comercial</div>
			<div class="col-3 text-end">Total</div>
		</div>
		<div class="row py-2 border-bottom align-items-center" th:each="pedido : ${listaPedidos}">
			<div class="col-2" th:text="${pedido.id}">1</div>
			<div class="col-3" th:text="${pedido.fecha}">2017-10-05</div>
			<div class="col-4">
				<!-- el enlace abre el detalle del comercial en otra pestaña -->
				<a th:href="@{/comerciales/{id}(id=${pedido.comercialId})}" th:text="${pedido.comercialNombre}"
					target="_blank" rel="noopener">Comercial</a>
			</div>
			<div class="col-3 text-end" th:text="${#numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</div>
		</div>
	</div>
</div>
</body>
</html>
