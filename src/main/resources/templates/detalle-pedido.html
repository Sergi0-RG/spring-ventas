<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Detalle Pedido</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-3">
	<div class="container">
		<a class="navbar-brand" th:href="@{/clientes}">Ventas</a>
		<ul class="navbar-nav">
			<li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/comerciales}">Comerciales</a></li>
			<li class="nav-item"><a class="nav-link active" th:href="@{/pedidos}">Pedidos</a></li>
		</ul>
	</div>
</nav>
<div class="container">
	<div class="row align-items-center border-bottom py-3 mb-3">
		<div class="col-6">
			<h1 class="display-6 mb-0">Detalle Pedido</h1>
		</div>
		<div class="col-6 text-end">
			<a class="btn btn-secondary" th:href="@{/pedidos}">Volver</a>
		</div>
	</div>
	<div class="row mb-3">
		<label class="col-md-3 col-form-label">Id</label>
		<div class="col-md-6"><input type="text" class="form-control" th:value="${pedido.id}" readonly="readonly"/></div>
	</div>
	<div class="row mb-3">
		<label class="col-md-3 col-form-label">Fecha</label>
		<div class="col-md-6"><input type="text" class="form-control" th:value="${pedido.fecha}" readonly="readonly"/></div>
	</div>
	<div class="row mb-3">
		<label class="col-md-3 col-form-label">Cliente</label>
		<div class="col-md-6"><input type="text" class="form-control" th:value="${pedido.clienteNombre}" readonly="readonly"/></div>
	</div>
	<div class="row mb-3">
		<label class="col-md-3 col-form-label">Comercial</label>
		<div class="col-md-6"><input type="text" class="form-control" th:value="${pedido.comercialNombre}" readonly="readonly"/></div>
	</div>
	<div class="row mb-3">
		<label class="col-md-3 col-form-label">Total</label>
		<div class="col-md-6"><input type="text" class="form-control" th:value="${#numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'COMMA')} + ' €'" readonly="readonly"/></div>
	</div>
</div>
</body>
</html>
