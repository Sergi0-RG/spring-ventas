<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Editar Pedido</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-3">
	<div class="container">
		<a class="navbar-brand" th:href="@{/clientes}">Ventas</a>
		<ul class="navbar-nav">
			<li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/comerciales}">Comerciales</a></li>
			<li class="nav-item"><a class="nav-link active" th:href="@{/pedidos}">Pedidos</a></li>
		</ul>
	</div>
</nav>
<div class="container">
	<form th:action="@{/pedidos/editar/__${pedido.id}__}" th:object="${pedido}" method="post">
		<div class="row align-items-center border-bottom py-3 mb-3">
			<div class="col-6">
				<h1 class="display-6 mb-0">Editar Pedido</h1>
			</div>
			<div class="col-6 text-end">
				<a class="btn btn-secondary" th:href="@{/pedidos}">Cancelar</a>
				<button class="btn btn-primary" type="submit">Guardar</button>
			</div>
		</div>

		<div th:if="${errores}" class="alert alert-danger" role="alert">
			<ul class="mb-0">
				<li th:each="e : ${errores}" th:text="${e}">Error</li>
			</ul>
		</div>

		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Id</label>
			<div class="col-md-6">
				<input type="text" class="form-control" th:field="*{id}" readonly="readonly"/>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Fecha</label>
			<div class="col-md-6">
				<input type="date" class="form-control" th:field="*{fecha}"/>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Cliente</label>
			<div class="col-md-6">
				<select class="form-select" th:field="*{clienteId}" required>
					<option value="">-- Selecciona un cliente --</option>
					<option th:each="c : ${listaClientes}" th:value="${c.id}" th:text="${c.nombreCompleto}">Cliente</option>
				</select>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Comercial</label>
			<div class="col-md-6">
				<select class="form-select" th:field="*{comercialId}" required>
					<option value="">-- Selecciona un comercial --</option>
					<option th:each="c : ${listaComerciales}" th:value="${c.id}" th:text="${c.nombreCompleto}">Comercial</option>
				</select>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-md-3 col-form-label">Total (€)</label>
			<div class="col-md-6">
				<input type="number" class="form-control" th:field="*{total}" step="0.01" min="0" required/>
			</div>
		</div>
	</form>
</div>
</body>
</html>
